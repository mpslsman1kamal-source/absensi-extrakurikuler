<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00164e">
  <title>SIABSENS-EKSKUL SMAN 1 Kamal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Simbol logo SMAN 1 Kamal (dipakai berulang lewat <use>) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="lgShield" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3b62d6"/><stop offset="1" stop-color="#1f3f9e"/>
      </linearGradient>
      <symbol id="logo" viewBox="0 0 100 112">
        <path d="M50 4 L92 18 V54 C92 82 74 100 50 108 C26 100 8 82 8 54 V18 Z" fill="url(#lgShield)"/>
        <path d="M50 11 L85 23 V54 C85 78 70 93 50 100 C30 93 15 78 15 54 V23 Z" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="4.5 3.5" stroke-linecap="round"/>
        <path d="M50 28 C58 36 58 50 54 58 H46 C42 50 42 36 50 28 Z" fill="#f59e0b"/>
        <circle cx="50" cy="42" r="3.4" fill="#fff"/>
        <path d="M46 58 L42 66 L48 62 Z M54 58 L58 66 L52 62 Z" fill="#d97706"/>
        <circle cx="32" cy="40" r="2" fill="#f59e0b"/><circle cx="28" cy="50" r="1.6" fill="#f59e0b"/>
        <path d="M22 66 C34 62 44 64 50 69 C56 64 66 62 78 66 V80 C66 76 56 78 50 83 C44 78 34 76 22 80 Z" fill="#fff"/>
        <path d="M50 69 V83" stroke="#cbd5e1" stroke-width="1.2"/>
        <circle cx="68" cy="42" r="10" fill="#fff"/><circle cx="68" cy="42" r="8" fill="#16a34a"/>
        <path d="M63.6 42.2 L67 45.6 L72.6 39.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- Splash awal -->
  <div id="splash" class="splash">
    <svg width="72" height="80"><use href="#logo"/></svg>
    <div class="spinner"></div>
    <div class="muted fs13">Memuat SIABSENS-EKSKUL </div>
  </div>

  <!-- ---------- HALAMAN LOGIN ---------- -->
  <div id="viewLogin" class="login-wrap hide">
    <div class="login-card">
      <div class="login-logo" id="loginLogo"><svg viewBox="0 0 100 112"><use href="#logo"/></svg></div>
      <div class="center"><span class="school-chip"><i class="bi bi-mortarboard"></i> SMAN 1 KAMAL   KABUPATEN BANGKALAN</span></div>
      <h1 class="login-title">SIABSENS-EKSKUL</h1>
      <div class="login-sub">Sistem Presensi &amp; Rekapitulasi Ekstrakurikuler Siswa</div>

      <div class="seg-tabs" id="loginTabs" role="tablist">
        <button type="button" class="on" data-role="pembina" role="tab">Pembina</button>
        <button type="button" data-role="admin" role="tab">Waka / Admin</button>
        <button type="button" data-role="super" role="tab">Super Admin</button>
      </div>

      <form id="loginForm" autocomplete="on" novalidate>
        <div class="field">
          <label for="lgUser"><span>NIP / Username Akun</span><small id="lgRoleHint">Pembina Ekskul</small></label>
          <div class="inp-wrap">
            <i class="bi bi-person-circle lead"></i>
            <input id="lgUser" class="inp pl" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Masukkan NIP atau username" required>
          </div>
        </div>
        <div class="field">
          <label for="lgPass"><span>Kata Sandi</span><small id="lgForgot" style="color:var(--tert-c)">Lupa Password?</small></label>
          <div class="inp-wrap">
            <i class="bi bi-lock lead"></i>
            <input id="lgPass" class="inp pl" type="password" name="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required style="padding-right:46px">
            <button type="button" class="trail" id="lgEye" aria-label="Tampilkan kata sandi"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <label class="chk" style="margin-bottom:16px"><input type="checkbox" id="lgRemember" checked> Ingat sesi masuk di perangkat ini</label>
        <div id="lgError" class="ferr hide" style="margin:-6px 0 12px"></div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="lgSubmit">Masuk ke Sistem Presensi <i class="bi bi-arrow-right"></i></button>
      </form>

      <div class="demo-box hide" id="demoBox">
        <div class="t"><i class="bi bi-lightning-charge-fill" style="color:var(--primary)"></i> Login cepat uji coba:</div>
        <div class="row g8 wrap" id="demoBtns"></div>
      </div>
    </div>
  </div>

  <!-- ---------- APLIKASI (setelah login) ---------- -->
  <div id="viewApp" class="hide">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <div class="sb-brand">
        <svg viewBox="0 0 100 112"><use href="#logo"/></svg>
        <div class="tx">
          <div class="s1">SMAN 1 Kamal Bangkalan</div>
          <div class="s2">SIABSENS-EKSKUL</div>
          <div class="s3">Presensi Ekstrakurikuler</div>
        </div>
      </div>
      <div id="sbNav"></div>
      <div class="sb-foot">
        <div class="tx"><div class="r1">Peran Akses</div><div class="r2" id="sbRole">-</div></div>
        <button type="button" data-act="logout" aria-label="Keluar" title="Keluar"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </aside>
    <div class="sb-scrim" id="sbScrim"></div>

    <div class="main">
      <header class="topbar">
        <div class="topbar-in">
          <button type="button" class="icon-btn only-mobile" data-act="toggleSidebar" aria-label="Menu" id="btnMenu"><i class="bi bi-list"></i></button>
          <div class="crumb">
            <span class="row g8"><i class="bi bi-house-door"></i><span>Portal<br>Ekskul</span></span>
            <span class="sep">/</span>
            <b>Panel<br>Kerja</b>
          </div>
          <span class="ta-chip" id="taChip"><span class="dot pulse"></span> TA -</span>
          <div class="search" id="gSearchBox">
            <i class="bi bi-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);z-index:1"></i>
            <input class="inp" id="gSearch" type="search" placeholder="Cari NISN, nama siswa, pembina..." autocomplete="off" aria-label="Pencarian global">
            <span class="kbd">?K</span>
            <div class="search-res hide" id="gSearchRes"></div>
          </div>
          <div style="position:relative">
            <button type="button" class="icon-btn" data-act="bell" aria-label="Notifikasi"><i class="bi bi-bell"></i><span class="bell-dot hide" id="bellDot"></span></button>
          </div>
          <button type="button" class="profile" data-act="profileMenu" aria-label="Menu profil">
            <span class="avatar" id="tbAvatar">U</span>
            <span class="tx"><span class="nm trunc" id="tbName" style="display:block">-</span><span class="rl" id="tbRole">-</span></span>
          </button>
        </div>
      </header>
      <main class="content" id="app-container" tabindex="-1"></main>
    </div>

    <nav class="bnav" id="bnav" aria-label="Navigasi bawah"></nav>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div id="printRoot"></div>
  <input type="file" id="fileKegiatan" accept="image/*" capture="environment" class="hide">
  <input type="file" id="fileSelfie" accept="image/*" capture="user" class="hide">
  <input type="file" id="fileImport" accept=".xlsx,.xls,.csv" class="hide">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bwip-js@4.11.4/dist/bwip-js-min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
